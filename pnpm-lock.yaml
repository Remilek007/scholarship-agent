lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies: {}

  apps/web:
    dependencies:
      '@vitejs/plugin-react':
        specifier: ^5.0.2
        version: 5.0.2
      react:
        specifier: ^19.1.1
        version: 19.1.1
      react-dom:
        specifier: ^19.1.1
        version: 19.1.1(react@19.1.1)
      vite:
        specifier: ^7.1.3
        version: 7.1.3
    devDependencies:
      typescript:
        specifier: ^5.9.2
        version: 5.9.2

  packages/database:
    dependencies:
      drizzle-orm:
        specifier: ^0.44.0
        version: 0.44.0(postgres@3.4.7)
      postgres:
        specifier: ^3.4.7
        version: 3.4.7
    devDependencies:
      drizzle-kit:
        specifier: ^0.31.4
        version: 0.31.4
      typescript:
        specifier: ^5.9.2
        version: 5.9.2

  packages/schemas:
    dependencies:
      '@scholarship-agent/shared':
        specifier: workspace:*
        version: link:../shared
      zod:
        specifier: ^4.0.0
        version: 4.1.5
    devDependencies:
      typescript:
        specifier: ^5.9.2
        version: 5.9.2

  packages/search:
    dependencies:
      '@scholarship-agent/shared':
        specifier: workspace:*
        version: link:../shared
    devDependencies:
      typescript:
        specifier: ^5.9.2
        version: 5.9.2

  packages/shared:
    devDependencies:
      typescript:
        specifier: ^5.9.2
        version: 5.9.2

  services/api:
    dependencies:
      '@scholarship-agent/database':
        specifier: workspace:*
        version: link:../../packages/database
      '@scholarship-agent/discovery':
        specifier: workspace:*
        version: link:../discovery
      '@scholarship-agent/schemas':
        specifier: workspace:*
        version: link:../../packages/schemas
      '@scholarship-agent/search':
        specifier: workspace:*
        version: link:../../packages/search
      '@scholarship-agent/shared':
        specifier: workspace:*
        version: link:../../packages/shared
      '@types/cors':
        specifier: ^2.8.17
        version: 2.8.19
      '@types/express':
        specifier: ^5.0.3
        version: 5.0.3
      cors:
        specifier: ^2.8.5
        version: 2.8.5
      express:
        specifier: ^5.1.0
        version: 5.1.0
    devDependencies:
      tsx:
        specifier: ^4.19.2
        version: 4.20.5
      typescript:
        specifier: ^5.9.2
        version: 5.9.2

  services/discovery:
    dependencies:
      '@scholarship-agent/database':
        specifier: workspace:*
        version: link:../../packages/database
      '@scholarship-agent/search':
        specifier: workspace:*
        version: link:../../packages/search
      '@scholarship-agent/shared':
        specifier: workspace:*
        version: link:../../packages/shared
    devDependencies:
      typescript:
        specifier: ^5.9.2
        version: 5.9.2

packages: {}
